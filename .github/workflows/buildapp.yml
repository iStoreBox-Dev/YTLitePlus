name: Build YTLitePlus IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      youtube_version:
        description: 'YouTube IPA version to use (e.g., 21.32.4)'
        required: false
        default: 'auto'
      ytlite_version:
        description: 'YTLite version to use (e.g., 5.2.2)'
        required: false
        default: 'auto'

env:
  THEOS: /var/lib/theos
  THEOS_MAKE_PATH: /var/lib/theos/makefiles
  HOME: /home/runner

jobs:
  build:
    name: Build YTLitePlus
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-path: /var/lib/theos

      - name: Setup environment
        run: |
          echo "THEOS=/var/lib/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=/var/lib/theos/makefiles" >> $GITHUB_ENV
          echo "HOME=/home/runner" >> $GITHUB_ENV
          mkdir -p /home/runner

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "Submodules initialized:"
          ls -la Tweaks/

      - name: Check YTLite version
        run: |
          if [ -d "Tweaks/YTLite" ]; then
            echo "YTLite directory contents:"
            ls -lh Tweaks/YTLite/ || true
          else
            echo "Warning: Tweaks/YTLite directory not found"
          fi

      - name: Build package
        run: |
          echo "Building YTLitePlus..."
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          make package FINALPACKAGE=1
          echo "Build complete. Checking output:"
          ls -lh packages/ || echo "No packages directory found"
          find . -name "*.ipa" -o -name "*.deb" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus-IPA
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.ipa
            packages/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          echo "Build completed at $(date)"
          echo "Artifact uploaded to GitHub Actions"
          echo "Check the Releases tab for download links"
