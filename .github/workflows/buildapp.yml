name: Build YTLitePlus IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'iOS SDK version to use (e.g., 18.6)'
        required: false
        default: '18.6'
      youtube_version:
        description: 'YouTube IPA version to use (e.g., 21.32.4)'
        required: false
        default: 'auto'
      ytlite_version:
        description: 'YTLite version to use (e.g., 5.2.2)'
        required: false
        default: 'auto'

env:
  HOME: /home/runner
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build YTLitePlus
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$THEOS/makefiles" >> $GITHUB_ENV
          echo "HOME=/home/runner" >> $GITHUB_ENV

      - name: Download Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos

      - name: Cache SDKs
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-14.5-16.2-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}

      - name: Download iOS SDKs
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          echo "Downloading iOS SDKs..."
          git clone -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs/
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk iPhoneOS14.5.sdk iPhoneOS16.2.sdk
          git checkout
          mv *.sdk $THEOS/sdks
          echo "Available SDKs:"
          ls -1 "$THEOS/sdks"

      - name: Verify SDKs
        run: |
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          echo "Available SDKs:"
          ls -la "$THEOS/sdks/" | head -10

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Check YTLite
        run: |
          ls -lh Tweaks/YTLite/ || echo "YTLite not found"

      - name: Patch hardcoded iOS SDK targets to latest
        run: |
          echo "Before patch:"
          grep -R "TARGET.*iphone:clang:" -n . || true
          
          find . -name Makefile -type f -print0 | while IFS= read -r -d '' file; do
            perl -0pi -e 's/iphone:clang:[0-9]+(?:\.[0-9]+)*:/iphone:clang:latest:/g' "$file"
          done
          
          echo "After patch:"
          grep -R "TARGET.*iphone:clang:" -n . || true

      - name: Build package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building YTLitePlus..."
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          make package FINALPACKAGE=1 \
            YTLITE_VERSION=${{ inputs.ytlite_version != 'auto' && inputs.ytlite_version || '' }}
          echo "Build complete:"
          ls -lh packages/ || echo "No packages directory"
          find . -name "*.ipa" -o -name "*.deb" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus-IPA
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.ipa
            packages/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
