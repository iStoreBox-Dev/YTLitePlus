name: Build YTLitePlus IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      youtube_version:
        description: 'YouTube IPA version to use (e.g., 21.32.4)'
        required: false
        default: 'auto'
      ytlite_version:
        description: 'YTLite version to use (e.g., 5.2.2)'
        required: false
        default: 'auto'

env:
  HOME: /home/runner

jobs:
  build:
    name: Build YTLitePlus
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Theos with SDKs
        uses: Randomblock1/theos-action@v1

      - name: Setup environment
        run: |
          THEOS_PATH="${{ github.workspace }}/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$THEOS_PATH/makefiles" >> $GITHUB_ENV
          echo "HOME=/home/runner" >> $GITHUB_ENV

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          ls -la "$THEOS/sdks/" | head -10

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Check YTLite
        run: |
          ls -lh Tweaks/YTLite/ || echo "YTLite not found"

      - name: Build package
        run: |
          echo "Building YTLitePlus..."
          make package FINALPACKAGE=1
          echo "Build complete:"
          ls -lh packages/ || echo "No packages directory"
          find . -name "*.ipa" -o -name "*.deb" | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus-IPA
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.ipa
            packages/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
